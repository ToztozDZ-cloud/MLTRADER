name: Python checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q agents backtest environment evolution trading training validation tests
      - name: Run tests
        run: python -m pytest -q
      - name: Check YAML configuration files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("config").glob("*.yaml"):
              with path.open(encoding="utf-8") as handle:
                  value = yaml.safe_load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"Invalid YAML mapping: {path}")
              print(f"OK: {path}")
          PY
