# Conservative starter universe for five-minute US-equity paper trading.
universe:
  dynamic_asset_discovery: false
  symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
  max_scan_symbols: 4
  bars_batch_size: 4
  max_positions: 3
  min_average_dollar_volume: 5000000
  min_price: 5.0
  min_signal_strength: 0.20
  max_position_fraction: 0.05
  max_gross_exposure: 0.15
  allow_short: false
  allow_fractional: true
  scan_interval_steps: 1
  flatten_before_close_minutes: 10
  daily_loss_limit_fraction: 0.02
